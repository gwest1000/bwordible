<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MannaGrams phone preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: #dfe4df; color: #25382c; font: 14px system-ui,sans-serif; }
  p { max-width: 640px; margin: 0 auto 12px; line-height: 1.5; }
  select { font: inherit; padding: 6px; margin-top: 8px; }
  iframe { display: block; width: 390px; height: 844px; margin: auto; border: 0; border-radius: 20px; background: #f6f3ea; box-shadow: 0 10px 35px #18332320; }
</style>
<p><strong>MannaGrams · Screen preview</strong><br>Try phone and tablet sizes. Wide previews may need a wider panel. Android system bars and native sharing appear on the device.<br>
<label>Screen size <select id="screenSize">
  <option value="390,844">Phone · 390 × 844</option>
  <option value="320,568">Small phone · 320 × 568</option>
  <option value="844,390">Phone landscape · 844 × 390</option>
  <option value="800,1280">Tablet · 800 × 1280</option>
  <option value="1280,800">Tablet landscape · 1280 × 800</option>
</select></label></p>
<iframe src="./" title="MannaGrams interactive phone preview"></iframe>
<script>
  navigator.serviceWorker?.addEventListener("controllerchange", () => {
    const frame = document.querySelector("iframe");
    frame.src = frame.src;
  });
  document.querySelector("#screenSize").addEventListener("change", (event) => {
    const [width, height] = event.target.value.split(",");
    const frame = document.querySelector("iframe");
    frame.style.width = width + "px";
    frame.style.height = height + "px";
  });
</script>
</html>
